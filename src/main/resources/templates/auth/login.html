<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Login - AppDomirest'">Login - AppDomirest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="decoration-line left"></div>
    <div class="decoration-line right"></div>

    <div class="auth-container">
        <div class="auth-header">
            <a th:href="@{/}" class="back-link">← Volver al inicio</a>
            <h1 class="auth-title">Bienvenido</h1>
            <p class="auth-subtitle">Ingresa tus credenciales para continuar</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            Usuario o contraseña incorrectos
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Sesión cerrada correctamente
        </div>

        <div th:if="${param.registered}" class="alert alert-success">
            Registro exitoso. Por favor, inicia sesión
        </div>

        <div th:if="${param.blocked}" class="alert alert-error">
            Tu cuenta ha sido desactivada. Contacta al administrador.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-input" id="username" name="username" placeholder="Ingresa tu usuario" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-input" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="submit-btn">Iniciar Sesión</button>
        </form>

        <div class="form-footer">
            <span>¿No tienes cuenta? </span>
            <a th:href="@{/register}">Regístrate</a>
        </div>
    </div>
</body>
</html>
