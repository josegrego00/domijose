<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-head :: admin-head}"></head>

<body>
    <div class="admin-wrapper">
        <header th:replace="~{fragments/admin-header :: admin-header}"></header>
        <nav th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></nav>

        <main class="admin-main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Clientes</h1>
                    <p class="page-subtitle">Gestiona los clientes registrados</p>
                </div>
            </div>

            <div class="stats-grid" style="margin-bottom: 2rem;">
                <div class="stat-card">
                    <div class="stat-icon users">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="stat-label">Total Clientes</div>
                    <div class="stat-value" th:text="${totalClientes}">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, rgba(90, 232, 133, 0.2), rgba(90, 232, 133, 0.1)); color: var(--success);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <div class="stat-label">Activos</div>
                    <div class="stat-value" th:text="${clientesActivos}">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, rgba(232, 90, 90, 0.2), rgba(232, 90, 90, 0.1)); color: var(--error);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                        </svg>
                    </div>
                    <div class="stat-label">Bloqueados</div>
                    <div class="stat-value" th:text="${clientesBloqueados}">0</div>
                </div>
            </div>

            <div class="search-container" style="margin-bottom: 1.5rem;">
                <form th:action="@{/admin/usuarios}" method="get" class="search-form">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" name="q" class="search-input" placeholder="Buscar por username o teléfono..."
                               th:value="${searchQuery}">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <a th:href="@{/admin/usuarios}" class="btn btn-secondary" th:if="${searchQuery}">Limpiar</a>
                    </div>
                </form>
            </div>

            <div th:if="${param.toggled}" class="alert alert-success">
                Estado del cliente actualizado exitosamente
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Teléfono</th>
                            <th>Username</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cliente : ${clientes}">
                            <td>
                                <span class="cliente-phone" th:text="${cliente.telefono}">3001234567</span>
                            </td>
                            <td>
                                <span class="cliente-username" th:text="${cliente.username}">username</span>
                            </td>
                            <td>
                                <span th:if="${cliente.activo}" class="badge badge-success">Activo</span>
                                <span th:unless="${cliente.activo}" class="badge badge-danger">Bloqueado</span>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <form th:action="@{/admin/usuarios/{id}/toggle(id=${cliente.id})}" method="post">
                                        <button type="submit" class="btn btn-icon"
                                                th:classappend="${cliente.activo} ? 'btn-danger' : 'btn-success'"
                                                th:title="${cliente.activo} ? 'Bloquear' : 'Activar'"
                                                data-confirm="¿Estás seguro de cambiar el estado?">
                                            <svg th:if="${cliente.activo}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <circle cx="12" cy="12" r="10"></circle>
                                                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                                            </svg>
                                            <svg th:unless="${cliente.activo}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                            </svg>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${clientes.isEmpty()}">
                            <td colspan="4" class="empty-message">
                                <span th:if="${searchQuery}">No se encontraron clientes con ese criterio de búsqueda.</span>
                                <span th:unless="${searchQuery}">No hay clientes registrados.</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
