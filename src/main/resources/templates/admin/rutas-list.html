<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-head :: admin-head}"></head>

<body>
    <div class="admin-wrapper">
        <header th:replace="~{fragments/admin-header :: admin-header}"></header>
        <nav th:replace="~{fragments/admin-sidebar :: admin-sidebar}"></nav>
        
        <main class="admin-main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Rutas de Domicilio</h1>
                    <p class="page-subtitle">Gestiona los barrios y costos de entrega</p>
                </div>
                <a th:href="@{/admin/rutas/nuevo}" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Nueva Ruta
                </a>
            </div>

            <div th:if="${param.success}" class="alert alert-success">
                Ruta creada exitosamente
            </div>
            <div th:if="${param.updated}" class="alert alert-success">
                Ruta actualizada exitosamente
            </div>
            <div th:if="${param.deleted}" class="alert alert-success">
                Ruta eliminada exitosamente
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Barrio</th>
                            <th>Costo de Domicilio</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ruta : ${rutas}">
                            <td>
                                <div class="ruta-info">
                                    <span class="ruta-name" th:text="${ruta.barrio}">Barrio</span>
                                </div>
                            </td>
                            <td>
                                <span class="ruta-price" th:text="${'$' + #numbers.formatDecimal(ruta.precio, 0, 'COMMA', 0, 'POINT')}">$5,000</span>
                            </td>
                            <td>
                                <span th:if="${ruta.activo}" class="badge badge-success">Activo</span>
                                <span th:unless="${ruta.activo}" class="badge badge-danger">Inactivo</span>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <a th:href="@{/admin/rutas/{id}/editar(id=${ruta.id})}" class="btn btn-icon btn-secondary" title="Editar">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </a>
                                    <form th:action="@{/admin/rutas/{id}/eliminar(id=${ruta.id})}" method="post">
                                        <button type="submit" class="btn btn-icon btn-danger" title="Eliminar" 
                                                data-confirm="¿Estás seguro de eliminar esta ruta?">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            </svg>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${rutas.isEmpty()}">
                            <td colspan="4" class="empty-message">
                                No hay rutas registradas. ¡Crea la primera!
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
